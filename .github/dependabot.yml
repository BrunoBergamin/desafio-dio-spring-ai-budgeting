# Dependabot abre PR quando sai versao nova. Semanal e agrupado, para nao virar spam de PR.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "org.springdoc*"
          - "io.swagger*"
      testes:
        patterns:
          - "org.testcontainers*"
          - "org.junit*"
          - "org.mockito*"
          - "org.assertj*"
      demais:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    ignore:
      # O typescript-eslint ainda nao aceita TypeScript 7, entao a major so quebra o npm ci.
      # Tire esta linha quando ele liberar suporte.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-router-dom"
          - "@types/react*"
      ferramentas:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"
          - "typescript"
          - "eslint*"
          - "typescript-eslint"
          - "@testing-library/*"
      demais:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore"
