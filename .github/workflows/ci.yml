name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvnw verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: chmod +x mvnw
      # Sem GROQ_API_KEY / OPENAI_API_KEY os testes com IA se desligam sozinhos: o build e verde e gratuito.
      # O MySqlMigrationsIT sobe um MySQL pelo Testcontainers (o runner ubuntu-latest ja tem Docker).
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/

  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Imagem Docker
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # Em push na main a imagem tambem e publicada, para o provedor de deploy puxar pronta
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Entrar no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nome da imagem em minusculas
        id: imagem
        # O GHCR exige o nome todo em minusculas e o usuario do GitHub tem maiusculas,
        # entao github.repository nao serve direto como tag
        run: echo "nome=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          # Em pull request so compila (valida o Dockerfile); na main publica
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.imagem.outputs.nome }}:latest
            ${{ steps.imagem.outputs.nome }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
