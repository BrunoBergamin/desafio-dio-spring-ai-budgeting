spring.datasource.url=jdbc:h2:mem:budgeting-test;DB_CLOSE_DELAY=-1
# As migrations do Flyway montam o schema tambem nos testes, assim elas sao validadas em todo build
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Chave falsa para o contexto subir sem chamar a OpenAI. Os testes *IT usam a variável real.
spring.ai.openai.api-key=${OPENAI_API_KEY:test-key}
app.jwt.secret=chave-de-teste-com-mais-de-trinta-e-dois-caracteres
