# Ative com: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# Sobe o MySQL do compose.yml automaticamente (precisa do Docker rodando).
spring.docker.compose.enabled=true
# Fora do Docker o MySQL do compose atende em localhost:3307; dentro do container o host e "database"
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/transaction}
spring.datasource.username=app
spring.datasource.password=app
spring.h2.console.enabled=false
