# Perfil "mysql": banco de verdade, com os dados guardados no volume do Docker (sobrevivem ao restart).
# E o padrao no docker compose. Fora do Docker:
#   docker compose up database                                   (sobe so o MySQL, em localhost:3307)
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=groq,mysql
# Sem este perfil a aplicacao usa H2 em memoria (some ao reiniciar).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/transaction}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app}
spring.h2.console.enabled=false
