# Perfil alternativo sem custo: usa a Groq, que tem API compatível com a da OpenAI.
# Ative com: ./mvnw spring-boot:run -Dspring-boot.run.profiles=groq
# Crie a chave gratuita em https://console.groq.com/keys e exporte como GROQ_API_KEY.
#
# O que funciona aqui: transcrição de áudio (Whisper) e chat com Tool Calling.
# O que NÃO funciona: a resposta falada em MP3 (a Groq não oferece text-to-speech no plano gratuito),
# então /assistant/voice responde 503 e as rotas /assistant/chat e /assistant/voice/text seguem completas.

# O Spring AI acrescenta /v1/... à base-url, por isso ela termina em /openai
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY:defina-a-variavel-GROQ_API_KEY}

spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.temperature=0.2

spring.ai.model.audio.transcription=openai
spring.ai.openai.audio.transcription.options.model=whisper-large-v3-turbo

# Desliga o text-to-speech: sem este bean a aplicação responde que o recurso está indisponível
spring.ai.model.audio.speech=none
