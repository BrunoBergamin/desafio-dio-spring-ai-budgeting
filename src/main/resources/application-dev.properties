# Perfil "dev": conveniencias so para desenvolvimento local, sem Docker.
# Ative com: ./mvnw spring-boot:run -Dspring-boot.run.profiles=groq,dev
# Console do H2 em http://localhost:8080/h2-console (JDBC URL jdbc:h2:mem:budgeting, usuario sa, sem senha).
# A SecurityConfig libera /h2-console e o iframe so quando esta propriedade e true.
spring.h2.console.enabled=true
