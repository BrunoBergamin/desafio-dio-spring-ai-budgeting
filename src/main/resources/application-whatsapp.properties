# Perfil "whatsapp": a Lumi responde tambem pelo WhatsApp, via Evolution API.
# Suba com: docker compose --profile whatsapp up --build   (SPRING_PROFILES_ACTIVE=groq,whatsapp no .env)
# Depois abra a pagina "WhatsApp" do site, escaneie o QR code com o celular e vincule o seu numero.
app.whatsapp.enabled=true
app.whatsapp.base-url=${EVOLUTION_URL:http://localhost:8081}
app.whatsapp.api-key=${EVOLUTION_API_KEY:}
app.whatsapp.instance=${WHATSAPP_INSTANCE:lumi}
app.whatsapp.webhook-secret=${WHATSAPP_WEBHOOK_SECRET:}
# URL que a Evolution usa para avisar esta aplicacao. Dentro do compose o host e "app"
app.whatsapp.webhook-url=${WHATSAPP_WEBHOOK_URL:http://app:8080/api/whatsapp/webhook/${WHATSAPP_WEBHOOK_SECRET:}}
# Responder a numeros nao vinculados? Padrao NAO: o numero pareado recebe mensagem de todo mundo (amigos, familia)
# e a Lumi responderia a todos. So ligue se o chip for exclusivo da Lumi.
app.whatsapp.reply-unknown=${WHATSAPP_REPLY_UNKNOWN:false}
