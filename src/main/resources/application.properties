spring.application.name=budgeting

# Lê as chaves de um arquivo .env na raiz do projeto, se ele existir (o .env está no .gitignore).
# Também funciona com variáveis de ambiente: se as duas existirem, a variável de ambiente vence.
spring.config.import=optional:file:./.env[.properties]

# ---------- Banco de dados ----------
# Sem perfil: H2 em memória (some ao reiniciar, não precisa de Docker). Com o perfil "mysql" (padrão no
# docker compose): MySQL com os dados no volume, ver application-mysql.properties.
spring.datasource.url=jdbc:h2:mem:budgeting;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
# O schema e criado pelas migrations em db/migration; o Hibernate so confere se bate com as entidades
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=false

# ---------- Spring AI / OpenAI ----------
spring.ai.openai.api-key=${OPENAI_API_KEY:defina-a-variavel-OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2

# Speech-to-text
spring.ai.model.audio.transcription=openai
spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.transcription.options.language=pt
spring.ai.openai.audio.transcription.options.temperature=0
spring.ai.openai.audio.transcription.options.response-format=text
spring.ai.openai.audio.transcription.options.prompt=Áudio em português brasileiro sobre finanças pessoais. \
  As frases geralmente contêm um valor em reais, uma ação (gastei, paguei, comprei) \
  e um local (mercado, farmácia, restaurante, posto, etc.).

# Text-to-speech
spring.ai.model.audio.speech=openai
spring.ai.openai.audio.speech.options.model=gpt-4o-mini-tts
spring.ai.openai.audio.speech.options.voice=nova
spring.ai.openai.audio.speech.options.speed=1.1
spring.ai.openai.audio.speech.options.response-format=mp3

# ---------- Upload de áudio ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------- Threads e memória ----------
# Threads virtuais (Java 21+): cada requisição e cada @Async custam poucos KB em vez de 1 MB de pilha
spring.threads.virtual.enabled=true
# Quantos webhooks do WhatsApp a Lumi processa ao mesmo tempo; acima disso o próximo espera (backpressure)
spring.task.execution.simple.concurrency-limit=8
# App de uso pessoal: 5 conexões bastam e o pool não segura memória à toa
spring.datasource.hikari.maximum-pool-size=5

# ---------- Documentação ----------
springdoc.swagger-ui.path=/swagger-ui.html

# ---------- Observabilidade ----------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@

logging.level.org.springframework.ai=INFO

# ---------- Autenticacao (JWT HS256) ----------
# Em producao defina APP_JWT_SECRET (minimo 32 caracteres). Este padrao serve so para desenvolvimento local.
app.jwt.secret=${APP_JWT_SECRET:controle-financeiro-lumi-chave-de-desenvolvimento-nao-use-em-producao}
app.jwt.expiration=8h

# ---------- Fuso horario ----------
# "Hoje" e "mes atual" seguem este fuso, e nao o do servidor (o container roda em UTC)
app.timezone=America/Sao_Paulo

# ---------- Lumi ----------
# Percentual do limite a partir do qual o orcamento entra em atencao
app.budget.warning-threshold=80
# Quantidade de mensagens lembradas por conversa
app.chat.memory-window=10
# Quantidade máxima de conversas guardadas em RAM; a parada há mais tempo é descartada (LRU)
app.chat.max-conversations=200

# ---------- WhatsApp (perfil whatsapp, opcional) ----------
app.whatsapp.enabled=false

# ---------- Modo demonstracao ----------
# Cria uma conta pronta com gastos e orcamentos de exemplo e o site entra nela sozinho (sem cadastro nem senha).
# Desligue com APP_DEMO_ENABLED=false para uso real com contas de verdade.
app.demo.enabled=${APP_DEMO_ENABLED:true}
app.demo.email=demo@lumi.local
app.demo.password=lumi-demo-1234
app.demo.name=Bruno (demo)
